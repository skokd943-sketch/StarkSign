<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Установить Stark Sign</title>
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;
 background:radial-gradient(120% 80% at 50% -10%,#1d2a6b,#141416 60%);color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;text-align:center}
img{width:96px;height:96px;border-radius:24px}
h1{margin:4px 0 0;font-size:32px;letter-spacing:-1px}
p{margin:0;color:rgba(255,255,255,.62);font-size:16px;line-height:1.45;max-width:320px}
a.go{display:flex;align-items:center;justify-content:center;width:100%;max-width:340px;min-height:62px;border-radius:20px;background:linear-gradient(135deg,#22c55e,#16a34a);
 color:#fff;font:700 20px inherit;font-family:inherit;text-decoration:none;box-shadow:0 14px 34px -12px #22c55e}
a.go:active{transform:scale(.97)}
a.alt{color:#7cc4ff;font-size:15px;text-decoration:none}
button{background:none;border:0;color:rgba(255,255,255,.5);font:14px inherit;font-family:inherit}
small{color:rgba(255,255,255,.4);max-width:320px;line-height:1.4}
</style></head><body>
<img src="icon-512.png" alt="">
<h1>Stark Sign</h1>
<p>Нажми зелёную кнопку: каталог приложений добавится в SideStore, дальше останется выбрать приложение.</p>
<a class="go" id="ss" href="#">Добавить в SideStore</a>
<a class="alt" id="as" href="#">Или в AltStore</a>
<button id="cp">Скопировать ссылку на каталог</button>
<small>Нужен установленный SideStore или AltStore. Без него iOS не даст поставить приложение с бесплатным Apple ID.</small>
<script>
const srv=(new URLSearchParams(location.search).get('srv')||localStorage.srv||'https://stark-sign-server-production.up.railway.app').replace(/\/+$/,'');
const u=srv+'/api/source.json',e=encodeURIComponent(u);
document.getElementById('ss').href='sidestore://source?url='+e;
document.getElementById('as').href='altstore://source?url='+e;
document.getElementById('cp').onclick=async function(){try{await navigator.clipboard.writeText(u);this.textContent='Скопировано ✓'}catch(_){prompt('Ссылка на каталог',u)}};
</script></body></html>
