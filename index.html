<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keeper"><meta name="theme-color" content="#10161f">
<title>Keeper</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#10161f;--card:#1d2633;--pill:#293342;--mute:#8d95a8;--red:#ff4f6d;--green:#2fd16f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#10161f}}
:root[data-theme="dark"]{--bg:#10161f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:Montserrat,-apple-system,"SF Pro Display",Arial,sans-serif;-webkit-user-select:none;user-select:none}
img{display:block}
.app{max-width:440px;margin:0 auto;padding:12px 16px 110px}
.top{display:flex;align-items:center;justify-content:space-between;height:44px}
.pill{background:var(--pill);border-radius:99px;height:39px;padding:0 14px;display:flex;align-items:center;gap:7px;font-weight:600;font-size:16px}
.right{display:flex;gap:18px}
.bal{text-align:center;margin-top:44px}
.big{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:46px;letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:31px;font-weight:700}
.addr{color:var(--mute);font-size:14.5px;margin-top:10px;font-weight:500}
.acts{display:grid;grid-template-columns:repeat(4,1fr);max-width:320px;margin:36px auto 26px;text-align:center}
.acts div{display:flex;flex-direction:column;align-items:center;gap:6px;color:#aab1c2;font-size:12.5px;font-weight:600}
.acts img{transition:transform .15s}.acts div:active img{transform:scale(.92)}
.ban{position:relative;display:block}
.ban img{width:100%;height:auto}
#bx{position:absolute;top:5%;right:1.5%;width:10%;height:34%}
.sech{display:flex;justify-content:space-between;align-items:center;margin:30px 0 14px;font-size:18px;font-weight:700}
.sech span{display:flex;align-items:center;gap:6px}
.sech small{color:#aab1c2;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.list{background:var(--card);border-radius:24px;padding:0 16px}
.row{display:flex;align-items:center;gap:15px;height:75px;border-bottom:1px solid #232d3b}
.row:last-child{border:0;height:78px}
.nm{flex:1;min-width:0}
.nm b{font-size:17px;font-weight:700;display:flex;align-items:center;gap:7px}
.tag{font-size:11px;font-weight:700;padding:4px 7px;border-radius:6px;background:#1f4a3d;color:var(--green)}
.tag.g{background:#2d3544;color:#8d95a8}
.sub{color:var(--mute);font-size:14.5px;font-weight:500;margin-top:3px}
.dn{color:var(--red)}.up{color:var(--green)}
.vl{text-align:right;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.vl div{color:var(--mute);font-weight:500;font-size:14.5px;margin-top:3px}
.open{background:var(--pill);border-radius:99px;padding:14px 20px;font-weight:700;font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);display:flex;justify-content:space-around;padding:10px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;color:#7b8396;width:33%}
nav div.on{color:#3d8bff}

</style></head><body>

<script>
var total=48250.37,P={g:.94,t:.99},S={g:.7,t:.3};
try{var s=localStorage.getItem("w_total");if(s&&+s>0)total=+s}catch(e){}
function f(n,d){return n.toLocaleString("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d})}
function render(){var t=f(total,2).split(",");
 document.getElementById("int").textContent=t[0];document.getElementById("dec").textContent=","+t[1];
 var g=total*S.g,u=total*S.t;
 document.getElementById("gAmt").textContent=f(g/P.g,3);document.getElementById("gUsd").textContent="$"+f(g,2);
 document.getElementById("tAmt").textContent=f(u/P.t,2);document.getElementById("tUsd").textContent="$"+f(u,2)}
document.addEventListener("click",function(e){
 if(e.target.closest("#bx")){document.getElementById("ban").style.display="none";return}
 if(e.target.closest("#balTap")){var v=prompt("Сумма баланса в $",total);
  if(v){v=parseFloat(String(v).replace(/\s/g,"").replace(",","."));
   if(v>0){total=v;try{localStorage.setItem("w_total",v)}catch(x){}render()}}}});
render();

</script>
