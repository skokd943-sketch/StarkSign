name: Build Stark Sign

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Node syntax
        shell: bash
        run: |
          node --check server.js 2>&1 | tee syntax.log
      - name: Build complete signing image
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain -t stark-sign:test . 2>&1 | tee docker-build.log
      - name: Save build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stark-sign-build-logs
          path: |
            syntax.log
            docker-build.log
          if-no-files-found: ignore
