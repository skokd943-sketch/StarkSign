name: Build Stark Sign

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build complete signing image
        shell: bash
        run: |
          set -o pipefail
          docker build --progress=plain -t stark-sign:test . 2>&1 | tee docker-build.log
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-log
          path: docker-build.log
          if-no-files-found: ignore
