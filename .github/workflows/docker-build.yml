name: Build Stark Sign

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build complete signing image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: stark-sign:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
